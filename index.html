<style>

</style><style>
:root{--bg:#eef3f6;--pr:#0d9488;--pr3:#10b981;--pr2:#d9f5ef;--ln:#e6ecf1;--sh:0 6px 24px rgba(15,60,70,.08);--sh2:0 8px 20px rgba(13,148,136,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1116;--card:#141d25;--pr:#2dd4bf;--pr3:#34d399;--pr2:#12403c;--ln:#223039;--sh:0 6px 24px rgba(0,0,0,.35);--sh2:0 8px 22px rgba(45,212,191,.22)}}

:root:not([data-theme=light]) button.s{color:var(--pr)}
@media (prefers-color-scheme:light){button:not(.s):not(.d){color:#fff}}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--ln);border-radius:24px;background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.14);max-width:616px;margin:auto}

nav a:active{transform:scale(.92)}nav a.on{background:var(--pr2)}
nav a span{transition:transform .25s}nav a.on span{transform:translateY(-2px) scale(1.15)}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bar{height:16px;border-radius:12px}
.bar i{background:linear-gradient(90deg,var(--pr),var(--pr3));border-radius:12px;transition:width 1.1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:sh 2.4s 1.2s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.row{transition:background .2s,padding .2s;border-radius:8px}.row:hover{background:color-mix(in srgb,var(--pr) 6%,transparent)}

@keyframes pul{50%{box-shadow:0 0 0 6px rgba(245,158,11,.15)}}
#app>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
#app>:nth-child(2){animation-delay:.06s}#app>:nth-child(3){animation-delay:.12s}#app>:nth-child(4){animation-delay:.18s}#app>:nth-child(5){animation-delay:.24s}#app>:nth-child(n+6){animation-delay:.3s}
.grid>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.grid>:nth-child(2){animation-delay:.08s}.grid>:nth-child(3){animation-delay:.14s}.grid>:nth-child(4){animation-delay:.2s}.grid>:nth-child(5){animation-delay:.26s}.grid>:nth-child(6){animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
svg rect{transform-origin:bottom;transform-box:fill-box;animation:gr .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes gr{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cel{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fi .25s both}
.cel.out{animation:fo .3s both}
.cel>div{position:relative;background:var(--card);border-radius:28px;padding:26px 34px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;min-width:230px}
.cel b{display:block;font-size:20px;margin-top:10px}.cel small{color:var(--mu)}
.pt{position:absolute;left:50%;top:60px;width:0;height:0}
.pt i{position:absolute;width:9px;height:9px;border-radius:50%;opacity:0;animation:bu .9s ease-out both}
@keyframes bu{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
.ck1{stroke-dasharray:152;stroke-dashoffset:152;animation:dr .6s .1s forwards}.ck2{stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .5s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.ico{font-size:56px;animation:drop .6s cubic-bezier(.3,1.6,.5,1) both}

@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fi{from{opacity:0}}@keyframes fo{to{opacity:0}}
.ck1,.ck2{stroke-dashoffset:0!important}
.vr{border-left:4px solid var(--ln);padding-left:10px;margin:2px 0}

.b1 i{background:linear-gradient(90deg,#ef4444,#f97316)}.b2 i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.b3 i{background:linear-gradient(90deg,#0ea5e9,#14b8a6)}.b4 i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.t1{color:#ef4444}.t2{color:#d97706}.t3{color:#0d9488}.t4{color:var(--ok)}

:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#0a0a0a;--card:#151515;--tx:#f5f1e6;--mu:#a59d8a;--pr:#d4af37;--pr3:#f5d77a;--pr2:#2a2310;--ln:#2b2619;--bad:#f87171;--ok:#4ade80;--sh:0 6px 24px rgba(0,0,0,.55);--sh2:0 8px 22px rgba(212,175,55,.22);color-scheme:dark}

.warn{background:#2a2108;color:#fcd34d}

:root,:root:not([data-theme=light]),:root[data-theme=dark]{--bg:#070b0a;--card:#0f1613;--tx:#ecf5f1;--mu:#8fa39b;--pr:#10b981;--pr3:#34d399;--pr2:#0c2a20;--ln:#1b2b25;--sh2:0 8px 22px rgba(16,185,129,.25)}
.card,.k{border-color:#1d3329}

</style></head><body>
<header>JG Gestão</header><main id="app"></main>
<nav id="nav"></nav>
<script>
const $=id=>document.getElementById(id);
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s.split('-').reverse().join('/');
const num=id=>{const v=parseFloat(String($(id).value).replace(',','.'));return isNaN(v)?NaN:v};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=()=>({cfg:{preco:70,meta:15000,fim:'2026-12-31',alerta:5,neg:false},compras:[],vendas:[],ajustes:[],despesas:[],cats:['Transporte','Embalagem','Manutenção','Taxas','Divulgação','Alimentação em serviço','Compras diversas','Outras despesas'],seq:1});
let D;try{D=JSON.parse(localStorage.getItem('helper'))||DEF()}catch(e){D=DEF()}
const save=()=>{try{localStorage.setItem('helper',JSON.stringify(D))}catch(e){}};
const nid=()=>D.seq++;
let T='painel',editV=null,flt={p:'tudo',t:'todos',a:'',b:''};

function calc(){
 let q=0,c=0,ev=[];
 D.compras.forEach(x=>ev.push({t:'c',x}));
 D.vendas.filter(v=>!v.canc).forEach(x=>ev.push({t:'v',x}));
 D.ajustes.forEach(x=>ev.push({t:'a',x}));
 ev.sort((a,b)=>a.x.data<b.x.data?-1:a.x.data>b.x.data?1:a.x.id-b.x.id);
 ev.forEach(e=>{const avg=q>0?c/q:0,x=e.x;
  if(e.t=='c'){q+=x.qtd;c+=x.total}
  else if(e.t=='v'){x.cogs=avg*x.qtd;q-=x.qtd;c-=x.cogs}
  else{q+=x.qtd;c+=avg*x.qtd}
  if(q<=0)c=0});
 D.vendas.forEach(v=>{v.bruto=v.qtd*v.preco;v.taxa=(v.bruto-v.desc)*v.taxaPct/100;v.liq=v.bruto-v.desc-v.taxa;if(v.canc)v.cogs=0;v.lucro=v.liq-v.cogs});
 const A=D.vendas.filter(v=>!v.canc),s=f=>A.reduce((t,v)=>t+f(v),0);
 const un=s(v=>v.qtd),fat=s(v=>v.bruto),lb=s(v=>v.lucro),desp=D.despesas.reduce((t,d)=>t+d.valor,0);
 return {q,c,avg:q>0?c/q:0,un,fat,lb,desp,ll:lb-desp,A}
}
function dias(){const f=new Date(D.cfg.fim+'T23:59:59');return Math.max(0,Math.ceil((f-new Date())/864e5))}

function nav(){const t=[['painel','📊','Painel'],['vendas','🛒','Vendas'],['estoque','📦','Estoque'],['despesas','💸','Despesas'],['mais','⚙️','Mais']];
 $('nav').innerHTML=t.map(x=>`<a href="#" class="${T==x[0]?'on':''}" onclick="go('${x[0]}');return false"><span>${x[1]}</span>${x[2]}</a>`).join('')}
function go(t){T=t;if(t!='vendas')editV=null;editC=null;editE=null;render();scrollTo(0,0)}
function render(){nav();const m=calc();$('app').innerHTML=({painel,vendas,estoque,despesas,mais})[T](m)}

function painel(m){
 const vazio=!D.compras.length&&!D.vendas.length;
 const rest=Math.max(0,D.cfg.meta-m.ll),pct=Math.min(100,Math.max(0,m.ll/D.cfg.meta*100)),d=dias();
 const lpu=m.un?m.lb/m.un:(m.q>0?D.cfg.preco-m.avg:NaN);
 let proj='';
 if(m.A.length){const ini=m.A.map(v=>v.data).sort()[0],dd=Math.max(1,Math.round((new Date(hoje())-new Date(ini))/864e5)+1);
  proj=m.A.length>=3&&dd>=3?`Projeção de lucro até a data final: <b>${brl(m.ll+m.ll/dd*d)}</b>`:'Dados insuficientes para uma projeção confiável (registre mais vendas).'}
 else proj='Sem vendas ainda: projeção indisponível.';
 const un=lpu>0?Math.ceil(rest/lpu):null;
 return (vazio?'<div class="card empty">Banco vazio. Comece cadastrando sua primeira <b>compra</b> na aba Estoque e depois registre uma venda.</div>':'')+
 (m.q<=D.cfg.alerta&&!vazio?`<div class="warn">⚠️ Estoque baixo: ${m.q} unidade(s) (alerta em ${D.cfg.alerta}).</div>`:'')+
 `<div class="k hero"><small>Lucro líquido acumulado</small><b>${brl(m.ll)}</b></div>
 <div class="grid" style="margin-top:0"><button onclick="quick()" style="margin-top:10px" ${m.q<1&&!D.cfg.neg?'disabled':''}>⚡ Venda rápida<span style="font-weight:400;font-size:12px;display:block">1 un · ${brl(D.cfg.preco)}</span></button><button class="s" onclick="fechar()" style="margin-top:10px">📋 Fechamento<span style="font-weight:400;font-size:12px;display:block">resumo do dia</span></button></div>
 <div class="grid" style="margin-top:10px">
 <div class="k"><small>Faturamento total</small><b>${brl(m.fat)}</b></div>
 <div class="k"><small>Unidades vendidas</small><b>${m.un}</b></div>
 <div class="k"><small>Em estoque</small><b>${m.q}</b></div>
 <div class="k"><small>Investido no estoque</small><b>${brl(m.c)}</b></div>
 <div class="k"><small>Lucro médio/unidade</small><b>${isNaN(lpu)?'—':brl(lpu)}</b></div>
 <div class="k"><small>Total em despesas</small><b>${brl(m.desp)}</b></div></div>
 <div class="card"><h2>Meta: ${brl(D.cfg.meta)} até ${fd(D.cfg.fim)}</h2>
 <div class="bar b${lvl(pct)}"><i style="width:${pct}%"></i></div>
 <div class="row"><span>Concluído</span><b class="t${lvl(pct)}">${pct.toFixed(1).replace('.',',')}%</b></div>
 <div class="row"><span>Falta</span><b>${brl(rest)}</b></div>
 <div class="row"><span>Dias restantes</span><b class="chip ${d>60?'ok':d>30?'am':d>14?'or':'rd'}">${d} dias</b></div>
 <div class="row"><span>Unidades a vender</span><b>${rest==0?0:un===null?'dados insuficientes':un}</b></div>
 <div class="row"><span>Meta por dia</span><b>${rest==0?0:un===null||!d?'—':(un/d).toFixed(1).replace('.',',')+' un/dia'}</b></div>
 <div class="mu" style="margin-top:6px">${proj}</div></div>
 ${cmpMes(m)}<div class="card"><h2>Vendas recentes</h2>${m.A.length?[...m.A].sort((a,b)=>b.data<a.data?-1:1).slice(0,5).map(v=>`<div class="row vr ${v.lucro<0?'vn':'vp'}"><span>${fd(v.data)} · ${v.qtd} un</span><b class="${v.lucro<0?'neg':'pos'}">${brl(v.liq)}</b></div>`).join(''):'<div class="empty">Nenhuma venda registrada.</div>'}</div>`+chart(m)}

function chart(m){const by={};m.A.forEach(v=>by[v.data]=(by[v.data]||0)+v.bruto);
 const k=Object.keys(by).sort().slice(-10);if(!k.length)return'';
 const mx=Math.max(...k.map(x=>by[x])),w=300/k.length;
 return`<div class="card"><h2>Faturamento por dia</h2><div class="sc"><svg viewBox="0 0 300 110" width="100%">${k.map((x,i)=>{const h=by[x]/mx*80;return`<rect x="${i*w+4}" y="${90-h}" width="${w-8}" height="${h}" rx="3" fill="var(--pr)"/><text x="${i*w+w/2}" y="104" font-size="8" text-anchor="middle" fill="var(--mu)">${x.slice(8)}/${x.slice(5,7)}</text>`}).join('')}</svg></div></div>`}

function vendas(m){
 const v=editV?D.vendas.find(x=>x.id==editV):null;
 const L=[...D.vendas].sort((a,b)=>b.data<a.data?-1:b.data>a.data?1:b.id-a.id);
 return`<div class="card"><h2>${v?'Editar venda':'Nova venda'}</h2>
 <label>Quantidade</label><input id="vq" type="number" inputmode="numeric" value="${v?v.qtd:''}">
 <label>Preço por unidade (R$)</label><input id="vp" type="number" inputmode="decimal" step="0.01" value="${v?v.preco:D.cfg.preco}">
 <label>Data</label><input id="vd" type="date" value="${v?v.data:hoje()}">
 <label>Forma de pagamento</label><select id="vf">${['Pix','Dinheiro','Cartão de débito','Cartão de crédito','Outro'].map(x=>`<option ${v&&v.pg==x?'selected':''}>${x}</option>`).join('')}</select>
 <label>Taxa do cartão (%)</label><input id="vt" type="number" inputmode="decimal" step="0.01" value="${v?v.taxaPct:0}">
 <label>Desconto (R$)</label><input id="vx" type="number" inputmode="decimal" step="0.01" value="${v?v.desc:0}">

 <button onclick="saveV()">${v?'Salvar alterações':'Confirmar venda'}</button>${v?'<button class="s" onclick="editV=null;render()">Cancelar edição</button>':''}</div>
 <div class="card"><h2>Histórico de vendas</h2>${L.length?L.map(x=>`<div class="row vr ${x.canc?'vc':x.lucro<0?'vn':'vp'}"><div><b>${fd(x.data)} · ${x.qtd} un × ${brl(x.preco)}</b><div class="mu">${x.pg}${x.canc?' · CANCELADA':` · líquido ${brl(x.liq)} · lucro <span class="${x.lucro<0?'neg':'pos'}">${brl(x.lucro)}</span>`}</div></div>${x.canc?'':`<div><button class="m s" onclick="editV=${x.id};render();scrollTo(0,0)">Editar</button> <button class="d" onclick="cancV(${x.id})">Cancelar</button></div>`}</div>`).join(''):'<div class="empty">Nenhuma venda ainda.</div>'}</div>`}
function saveV(){
 const q=num('vq'),p=num('vp'),t=num('vt'),x=num('vx'),dt=$('vd').value;
 if(!(q>0)||!Number.isInteger(q))return alert('Informe uma quantidade inteira maior que zero.');
 if(!(p>=0))return alert('Preço inválido.');if(!(t>=0&&t<=100))return alert('Taxa inválida.');
 if(!(x>=0)||x>q*p)return alert('Desconto inválido.');if(!dt)return alert('Informe a data.');
 const o={qtd:q,preco:p,data:dt,pg:$('vf').value,taxaPct:t,desc:x,obs:$('vo').value};
 const old=editV?D.vendas.find(z=>z.id==editV):null;
 const bak=JSON.stringify(D.vendas);
 if(old)Object.assign(old,o);else D.vendas.push({id:nid(),canc:false,cogs:0,...o});
 const m=calc();
 if(m.q<0&&!D.cfg.neg){D.vendas=JSON.parse(bak);calc();return alert('Estoque insuficiente. Falta(m) '+(-m.q)+' unidade(s). Habilite venda sem estoque em Mais > Configurações.')}
 const nv=old||D.vendas[D.vendas.length-1];editV=null;save();T='painel';render();celebrate('v',old?'Venda atualizada!':'Venda registrada!',brl(nv.lucro)+' de lucro nesta venda')}
function cancV(id){if(!confirm('Cancelar esta venda? O estoque e os lucros serão recalculados.'))return;D.vendas.find(v=>v.id==id).canc=true;save();render()}

function estoque(m){
 const mv=[...D.compras.map(x=>({d:x.data,id:x.id,t:'Compra',q:x.qtd,s:x.fornecedor||'',v:x.total,k:'c'})),...D.ajustes.map(x=>({d:x.data,id:x.id,t:x.tipo,q:x.qtd,s:x.motivo,k:'a'})),...D.vendas.filter(v=>!v.canc).map(x=>({d:x.data,id:x.id,t:'Venda',q:-x.qtd,s:'',k:'v'}))].sort((a,b)=>b.d<a.d?-1:b.d>a.d?1:b.id-a.id);
 return`<div class="grid"><div class="k"><small>Em estoque</small><b>${m.q}</b></div><div class="k"><small>Custo médio</small><b>${brl(m.avg)}</b></div></div>
 <div class="card"><h2>Registrar compra</h2>
 <label>Quantidade comprada</label><input id="cq" type="number" inputmode="numeric" oninput="cu()">
 <label>Valor total pago (R$)</label><input id="ct" type="number" inputmode="decimal" step="0.01" oninput="cu()">
 <div class="mu" id="cun">Custo unitário: —</div>
 <label>Data</label><input id="cd" type="date" value="${hoje()}">
 <label>Fornecedor (opcional)</label><input id="cf"><label>Observações (opcional)</label><input id="co">
 <button id="csave" onclick="saveC()">Salvar compra</button>
 <button class="s" onclick="$('cq').value=30;$('ct').value=397;cu()">Preencher exemplo (30 un por R$ 397,00)</button></div>
 <div class="card"><h2>Perda, avaria, devolução ou correção</h2>
 <label>Tipo</label><select id="at"><option>Perda</option><option>Avaria</option><option>Devolução (entrada)</option><option>Correção (+)</option><option>Correção (−)</option></select>
 <label>Quantidade</label><input id="aq" type="number" inputmode="numeric">
 <label>Motivo (obrigatório)</label><input id="am"><label>Data</label><input id="ad" type="date" value="${hoje()}">
 <button onclick="saveA()">Registrar movimentação</button></div>
 <div class="card"><h2>Histórico de estoque</h2>${mv.length?mv.map(x=>`<div class="row"><div><b>${fd(x.d)} · ${x.t}</b><div class="mu">${esc(x.s)}${x.v?' · '+brl(x.v):''}</div></div><div><b class="${x.q<0?'neg':'pos'}">${x.q>0?'+':''}${x.q}</b>${x.k=='c'?` <button class="d" onclick="startEditC(${x.id})">✎</button>`:''}${x.k!='v'?` <button class="d" onclick="delM('${x.k}',${x.id})">✕</button>`:''}</div></div>`).join(''):'<div class="empty">Nenhuma movimentação. Registre sua primeira compra.</div>'}</div>`}
function cu(){const q=num('cq'),t=num('ct');$('cun').textContent='Custo unitário: '+(q>0&&t>=0?brl(t/q):'—')}
function saveC(){const q=num('cq'),t=num('ct');
 if(!(q>0)||!Number.isInteger(q))return alert('Quantidade inválida.');if(!(t>=0))return alert('Valor inválido.');if(!$('cd').value)return alert('Informe a data.');
 if(editC){const c=D.compras.find(x=>x.id==editC),bak=JSON.stringify(c);Object.assign(c,{qtd:q,total:t,data:$('cd').value,fornecedor:$('cf').value,obs:$('co').value});if(calc().q<0&&!D.cfg.neg){Object.assign(c,JSON.parse(bak));calc();return alert('Não é possível: o estoque ficaria negativo por causa de vendas já feitas.')}editC=null;save();render();return celebrate('e','Compra atualizada!','Custo '+brl(t/q)+' cada')}
 D.compras.push({id:nid(),qtd:q,total:t,data:$('cd').value,fornecedor:$('cf').value,obs:$('co').value});save();render();celebrate('e','Estoque atualizado!','+'+q+' unidades · custo '+brl(t/q)+' cada')}
function saveA(){let q=num('aq');const tp=$('at').value,mo=$('am').value.trim();
 if(!(q>0)||!Number.isInteger(q))return alert('Quantidade inválida.');if(!mo)return alert('Informe o motivo.');if(!$('ad').value)return alert('Informe a data.');
 const sinal=/Perda|Avaria|−/.test(tp)?-1:1;
 if(sinal<0&&calc().q<q)return alert('Quantidade maior que o estoque atual.');
 D.ajustes.push({id:nid(),tipo:tp,qtd:q*sinal,motivo:mo,data:$('ad').value});save();render();celebrate('a','Movimentação registrada!',tp+': '+q+' un')}
function delM(k,id){if(!confirm('Excluir este registro? O estoque será recalculado.'))return;
 const key=k=='c'?'compras':'ajustes',bak=JSON.stringify(D[key]);D[key]=D[key].filter(x=>x.id!=id);
 const m=calc();if(m.q<0&&!D.cfg.neg){D[key]=JSON.parse(bak);calc();return alert('Não é possível excluir: o estoque ficaria negativo.')}save();render()}

function despesas(m){
 const L=[...D.despesas].sort((a,b)=>b.data<a.data?-1:1);
 return`<div class="card"><h2>Nova despesa</h2>
 <label>Nome</label><input id="en"><label>Valor (R$)</label><input id="ev" type="number" inputmode="decimal" step="0.01">
 <label>Categoria</label><select id="ec">${D.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
 <label>Data</label><input id="ed" type="date" value="${hoje()}">
 <label>Forma de pagamento</label><select id="ef"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Outro</option></select>
 <label>Observações</label><input id="eo"><button id="esave" onclick="saveE()">Salvar despesa</button>
 <label>Nova categoria</label><input id="nc"><button class="s" onclick="addCat()">Adicionar categoria</button></div>
 <div class="card"><h2>Despesas · ${brl(m.desp)}</h2>${L.length?L.map(d=>`<div class="row"><div><b>${esc(d.nome)}</b><div class="mu">${fd(d.data)} · ${esc(d.cat)} · ${d.pg}</div></div><div>${brl(d.valor)} <button class="d" onclick="startEditE(${d.id})">✎</button><button class="d" onclick="delE(${d.id})">✕</button></div></div>`).join(''):'<div class="empty">Nenhuma despesa lançada.</div>'}</div>
 <div class="mu">Taxas de cartão já entram na venda; não as lance aqui para não descontar duas vezes.</div>`}
function saveE(){const n=$('en').value.trim(),v=num('ev');
 if(!n)return alert('Informe o nome.');if(!(v>0))return alert('Valor inválido.');if(!$('ed').value)return alert('Informe a data.');
 const o={nome:n,valor:v,cat:$('ec').value,data:$('ed').value,pg:$('ef').value,obs:$('eo').value},was=editE;if(was){Object.assign(D.despesas.find(x=>x.id==was),o);editE=null}else D.despesas.push({id:nid(),...o});save();render();celebrate('a',was?'Despesa atualizada!':'Despesa registrada!',brl(v))}
function addCat(){const c=$('nc').value.trim();if(!c||D.cats.includes(c))return alert('Categoria vazia ou já existente.');D.cats.push(c);save();render()}
function delE(id){if(!confirm('Excluir esta despesa?'))return;D.despesas=D.despesas.filter(d=>d.id!=id);save();render()}

function inRange(d){const h=hoje();if(flt.p=='hoje')return d==h;
 if(flt.p=='semana'){const x=new Date();x.setDate(x.getDate()-6);return d>=x.toISOString().slice(0,10)&&d<=h}
 if(flt.p=='mes')return d.slice(0,7)==h.slice(0,7);
 if(flt.p=='custom')return(!flt.a||d>=flt.a)&&(!flt.b||d<=flt.b);return true}
function mais(m){
 const c=D.cfg,V=m.A.filter(v=>inRange(v.data)),Cp=D.compras.filter(x=>inRange(x.data)),E=D.despesas.filter(x=>inRange(x.data));
 const fat=V.reduce((t,v)=>t+v.bruto,0),lb=V.reduce((t,v)=>t+v.lucro,0),de=E.reduce((t,v)=>t+v.valor,0),co=Cp.reduce((t,v)=>t+v.total,0);
 const rows=[...(flt.t=='todos'||flt.t=='vendas'?V.map(v=>[v.data,'Venda',v.qtd+' un',v.liq]):[]),...(flt.t=='todos'||flt.t=='compras'?Cp.map(v=>[v.data,'Compra',v.qtd+' un',-v.total]):[]),...(flt.t=='todos'||flt.t=='despesas'?E.map(v=>[v.data,'Despesa',v.nome,-v.valor]):[])].sort((a,b)=>b[0]<a[0]?-1:1);
 const sel=(k,o)=>`<select onchange="flt.${k}=this.value;render()">${o.map(x=>`<option value="${x[0]}" ${flt[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
 return`<div class="card"><h2>Relatórios</h2>

function saveCfg(){const m=num('gm'),p=num('gp'),a=num('ga');
 if(!(m>0)||!(p>=0)||!(a>=0)||!$('gf').value)return alert('Verifique os valores informados.');
 D.cfg={meta:m,preco:p,alerta:a,fim:$('gf').value,neg:$('gn').value=='1'};save();alert('Configurações salvas.');render()}
function csv(){const m=calc(),q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 const L=['tipo;data;descricao;qtd;valor;lucro',...D.vendas.map(v=>['Venda'+(v.canc?' (cancelada)':''),v.data,v.pg,v.qtd,v.liq.toFixed(2),v.lucro.toFixed(2)].join(';')),...D.compras.map(v=>['Compra',v.data,q(v.fornecedor),v.qtd,v.total.toFixed(2),''].join(';')),...D.despesas.map(v=>['Despesa',v.data,q(v.nome),'',v.valor.toFixed(2),''].join(';'))].join('\n');
 $('bk').value=L;try{navigator.clipboard.writeText(L);alert('CSV copiado para a área de transferência.')}catch(e){alert('Copie o CSV da caixa de texto.')}}
function rest(){try{const j=JSON.parse($('bk').value);if(!j.cfg||!Array.isArray(j.vendas)||!Array.isArray(j.compras))throw 0;
 if(!confirm('Substituir os dados atuais pelo backup?'))return;D={...DEF(),...j};save();render()}catch(e){alert('Backup inválido.')}}

function cash(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
 const t=AC.currentTime,g=AC.createGain();g.gain.value=.5;g.connect(AC.destination);
 const ping=(f,s,d,v)=>{const o=AC.createOscillator(),e=AC.createGain();o.type='sine';o.frequency.value=f;e.gain.setValueAtTime(0,t+s);e.gain.linearRampToValueAtTime(v,t+s+.005);e.gain.exponentialRampToValueAtTime(.001,t+s+d);o.connect(e);e.connect(g);o.start(t+s);o.stop(t+s+d+.05)};
 const nb=AC.createBuffer(1,Math.floor(AC.sampleRate*.05),AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
 const ns=AC.createBufferSource(),ne=AC.createGain();ns.buffer=nb;ne.gain.value=.35;ns.connect(ne);ne.connect(g);ns.start(t);
 const nz=(s,d,v,f)=>{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const r=AC.createBufferSource(),fl=AC.createBiquadFilter(),e=AC.createGain();fl.type='bandpass';fl.frequency.value=f;e.gain.value=v;r.buffer=b;r.connect(fl);fl.connect(e);e.connect(g);r.start(t+s)};
 const th=s=>{const o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(160,t+s);o.frequency.exponentialRampToValueAtTime(50,t+s+.15);e.gain.setValueAtTime(.9,t+s);e.gain.exponentialRampToValueAtTime(.001,t+s+.18);o.connect(e);e.connect(g);o.start(t+s);o.stop(t+s+.2)};
 const bell=(s,f,v)=>[[1,1.3],[2.76,.8],[5.4,.5],[8.9,.25]].forEach((p,i)=>ping(f*p[0],s,p[1]*.9,v/(1+i*.8)));
 nz(0,.03,.5,2200);nz(.05,.03,.5,2600);nz(.1,.03,.45,2000);
 th(.15);nz(.15,.08,.7,400);
 bell(.24,2350,.45);bell(.42,2350,.35);
 for(let i=0;i<8;i++)ping(4200+Math.random()*2500,.62+i*.06+Math.random()*.03,.12,.1)}catch(e){}}
const lvl=p=>p>=100?4:p>=66?3:p>=33?2:1;
function celebrate(k,t,s){
 const c={v:['#10b981','#34d399'],e:['#0ea5e9','#38bdf8'],a:['#f59e0b','#fbbf24']}[k];
 const ic=k=='v'?'<svg viewBox="0 0 52 52" width="72" height="72"><circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="3" class="ck1"/><path d="M15 27l8 8 15-17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="ck2"/></svg>':'<div class="ico">'+(k=='e'?'📦':'📝')+'</div>';
 const p=Array.from({length:18},(_,i)=>{const a=i/18*6.283,r=95+Math.random()*55;return '<i style="--x:'+Math.cos(a)*r+'px;--y:'+Math.sin(a)*r+'px;background:'+(i%2?c[0]:c[1])+';animation-delay:'+Math.random()*.12+'s"></i>'}).join('');
 const o=document.createElement('div');o.className='cel';
 o.innerHTML='<div><div class="pt">'+p+'</div><div style="color:'+c[0]+';height:72px;display:grid;place-items:center">'+ic+'</div><b>'+t+'</b><small>'+(s||'')+'</small></div>';
 document.body.appendChild(o);try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}if(k=='v')cha();
 o.onclick=()=>o.remove();
 setTimeout(()=>o.classList.add('out'),1600);setTimeout(()=>o.remove(),1950);
}
let editC=null,editE=null;
function startEditC(id){const c=D.compras.find(x=>x.id==id);editC=id;T='estoque';render();
 $('cq').value=c.qtd;$('ct').value=c.total;$('cd').value=c.data;$('cf').value=c.fornecedor||'';$('co').value=c.obs||'';cu();
 const b=$('csave');b.textContent='Salvar alterações';b.insertAdjacentHTML('afterend','<button class="s" onclick="editC=null;render()">Cancelar edição</button>');scrollTo(0,0)}
function startEditE(id){const d=D.despesas.find(x=>x.id==id);editE=id;T='despesas';render();
 $('en').value=d.nome;$('ev').value=d.valor;$('ec').value=d.cat;$('ed').value=d.data;$('ef').value=d.pg;$('eo').value=d.obs||'';
 const b=$('esave');b.textContent='Salvar alterações';b.insertAdjacentHTML('afterend','<button class="s" onclick="editE=null;render()">Cancelar edição</button>');scrollTo(0,0)}
function quick(){D.vendas.push({id:nid(),canc:false,cogs:0,qtd:1,preco:D.cfg.preco,data:hoje(),pg:'Pix',taxaPct:0,desc:0,obs:'Venda rápida'});
 const m=calc();if(m.q<0&&!D.cfg.neg){D.vendas.pop();calc();return alert('Estoque insuficiente para vender 1 unidade.')}
 const v=D.vendas[D.vendas.length-1];save();render();celebrate('v','Venda rápida registrada!',brl(v.lucro)+' de lucro')}
function cmpMes(m){
 const h=new Date(),ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),a=ym(h),b=ym(new Date(h.getFullYear(),h.getMonth()-1,1));
 const f=p=>{const V=m.A.filter(v=>v.data.slice(0,7)==p),E=D.despesas.filter(x=>x.data.slice(0,7)==p);return {fat:V.reduce((t,v)=>t+v.bruto,0),ll:V.reduce((t,v)=>t+v.lucro,0)-E.reduce((t,v)=>t+v.valor,0),n:V.length}};
 const x=f(a),y=f(b);if(!x.n&&!y.n)return '';
 const row=(l,u,v)=>{const dif=u-v,pc=v?Math.abs(dif/Math.abs(v)*100):null;return `<div class="row"><span>${l}</span><div style="text-align:right"><b>${brl(u)}</b><div class="mu ${dif<0?'neg':'pos'}">${dif<0?'▼':'▲'} ${pc===null?'sem base':pc.toFixed(0)+'%'} vs ${brl(v)}</div></div></div>`};
 return `<div class="card"><h2>Este mês vs mês anterior</h2>${row('Faturamento',x.fat,y.fat)}${row('Lucro líquido',x.ll,y.ll)}</div>`}
function fechar(){const m=calc(),h=hoje(),V=m.A.filter(v=>v.data==h),E=D.despesas.filter(x=>x.data==h),C=D.compras.filter(x=>x.data==h);
 const s=(a,f)=>a.reduce((t,v)=>t+f(v),0),fat=s(V,v=>v.bruto),dt=s(V,v=>v.desc+v.taxa),cg=s(V,v=>v.cogs),lb=s(V,v=>v.lucro),de=s(E,v=>v.valor),co=s(C,v=>v.total);
 const rest=Math.max(0,D.cfg.meta-m.ll),pc=Math.min(100,Math.max(0,m.ll/D.cfg.meta*100));
 const t=['📊 Fechamento do dia '+fd(h)+' · JG Gestão','','Vendas: '+V.length+' ('+s(V,v=>v.qtd)+' un)','Faturamento: '+brl(fat),'Descontos e taxas: '+brl(dt),'Custo das mercadorias: '+brl(cg),'Lucro bruto: '+brl(lb),'Despesas: '+brl(de),'Lucro líquido do dia: '+brl(lb-de),'Compras de estoque: '+brl(co),'','Estoque atual: '+m.q+' un','Meta: '+pc.toFixed(1).replace('.',',')+'% concluída · faltam '+brl(rest)+' · '+dias()+' dias'].join('\n');
 const o=document.createElement('div');o.className='cel';
 o.innerHTML=`<div style="max-width:92vw;text-align:left"><b style="margin:0 0 8px">Fechamento do dia</b><pre id="ftx" style="white-space:pre-wrap;font:13px/1.5 system-ui;margin:0;color:var(--tx)"></pre><button onclick="copyF()">Copiar texto</button><button class="s" onclick="window.open(this.dataset.u,'_blank')" id="fwa">Enviar no WhatsApp</button><button class="s" onclick="this.closest('.cel').remove()">Fechar</button></div>`;
 document.body.appendChild(o);$('ftx').textContent=t;$('fwa').dataset.u='https://wa.me/?text='+encodeURIComponent(t);o.onclick=e=>{if(e.target==o)o.remove()}}
function copyF(){const t=$('ftx').textContent,sel=()=>{const r=document.createRange();r.selectNodeContents($('ftx'));getSelection().removeAllRanges();getSelection().addRange(r);alert('Texto selecionado: toque e copie.')};
 try{navigator.clipboard.writeText(t).then(()=>alert('Copiado!'),sel)}catch(e){sel()}}
const _r=render;
render=function(){_r();post()};
function post(){
 document.querySelectorAll('.bar i').forEach(i=>{const w=i.style.width;i.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=w))});
 document.querySelectorAll('.hero b,.k b').forEach(el=>{const t=el.textContent;if(!/^-?R\$|^\d+$/.test(t.trim()))return;
  const neg=/-/.test(t),n=parseFloat(t.replace(/[^\d,]/g,'').replace(',','.'))*(neg?-1:1);if(isNaN(n))return;
  const cur=/R\$/.test(t),t0=performance.now(),du=900;
  (function f(now){const p=Math.min(1,(now-t0)/du),e=1-Math.pow(1-p,3),v=n*e;
   el.textContent=cur?brl(v):Math.round(v);if(p<1)requestAnimationFrame(f);else el.textContent=t})(t0)})
}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
